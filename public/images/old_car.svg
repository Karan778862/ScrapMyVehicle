<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="oldCarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="shadowOld" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="210" rx="160" ry="18" fill="url(#shadowOld)" />

  <!-- Car Body Main Structure -->
  <!-- Vintage boxy shape -->
  <path d="M 50 160 
           L 50 120
           L 100 120
           L 130 80
           L 260 80
           L 300 120
           L 350 120
           L 350 160
           L 320 185
           L 310 185
           Q 310 150 280 150
           Q 250 150 250 185
           L 150 185
           Q 150 150 120 150
           Q 90 150 90 185
           L 70 185 Z" 
        fill="url(#oldCarBody)" stroke="#451a03" stroke-width="2"/>

  <!-- Cabin Roof & Windows (Dusty) -->
  <path d="M 135 85 L 255 85 L 285 120 L 105 120 Z" fill="#292524" />
  <path d="M 140 90 L 195 90 L 195 118 L 115 118 Z" fill="#d6d3d1" fill-opacity="0.4"/>
  <path d="M 205 90 L 250 90 L 275 118 L 205 118 Z" fill="#d6d3d1" fill-opacity="0.4"/>

  <!-- Rust spots -->
  <circle cx="90" cy="140" r="12" fill="#78350f" opacity="0.6"/>
  <circle cx="280" cy="135" r="18" fill="#451a03" opacity="0.7"/>
  <path d="M 330 140 Q 340 150 335 160 Q 320 160 315 145 Z" fill="#451a03" opacity="0.8" />
  <line x1="150" y1="140" x2="220" y2="140" stroke="#78350f" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Headlight & Taillight -->
  <rect x="340" y="130" width="10" height="15" fill="#fcd34d" opacity="0.4"/>
  <rect x="50" y="130" width="5" height="20" fill="#7f1d1d"/>

  <!-- Wheels (Flat / Vintage) -->
  <!-- Rear Wheel -->
  <g transform="translate(120, 185)">
    <circle cx="0" cy="0" r="24" fill="#292524"/>
    <circle cx="0" cy="0" r="14" fill="#a8a29e"/>
    <circle cx="0" cy="0" r="5" fill="#44403c"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#57534e" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#57534e" stroke-width="2"/>
  </g>

  <!-- Front Wheel (Flat) -->
  <g transform="translate(280, 188)">
    <ellipse cx="0" cy="0" rx="25" ry="21" fill="#292524"/>
    <circle cx="0" cy="0" r="14" fill="#a8a29e"/>
    <circle cx="0" cy="0" r="5" fill="#44403c"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#57534e" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#57534e" stroke-width="2"/>
  </g>

  <!-- Warning Badge overlay -->
  <g transform="translate(40, 40)">
    <rect width="120" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="100" y="18" fill="#b45309" font-size="12" font-weight="800" font-family="system-ui" text-anchor="middle">15+ YEARS OLD</text>
  </g>
</svg>
