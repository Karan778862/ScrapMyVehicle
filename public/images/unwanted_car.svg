<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="tarpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#059647"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="tarpHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059647" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadowUnwanted" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="210" rx="160" ry="18" fill="url(#shadowUnwanted)" />

  <!-- Covered Car Drape Silhouette -->
  <path d="M 60 190 
           C 50 180, 55 155, 75 140
           C 95 125, 120 115, 140 100
           C 165 80, 195 72, 230 72
           C 265 72, 290 85, 315 110
           C 335 125, 355 140, 365 160
           C 375 178, 365 190, 355 195
           C 330 200, 310 192, 280 192
           C 250 192, 230 198, 190 198
           C 150 198, 130 192, 100 192
           C 80 192, 70 198, 60 190 Z" 
        fill="url(#tarpGreen)" stroke="#065f46" stroke-width="2"/>

  <!-- Fabric Highlights / Creases & Folds -->
  <!-- Top Roof Curvature -->
  <path d="M 160 82 C 200 78, 250 78, 280 86" stroke="url(#tarpHighlight)" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Windshield Slope Fold -->
  <path d="M 145 105 C 190 92, 230 92, 295 115" stroke="#34d399" stroke-width="2" stroke-opacity="0.6" fill="none"/>
  
  <!-- Mirror bulges covered -->
  <ellipse cx="148" cy="118" rx="12" ry="8" fill="#047857" opacity="0.8" transform="rotate(-15 148 118)"/>
  <ellipse cx="282" cy="120" rx="12" ry="8" fill="#047857" opacity="0.8" transform="rotate(15 282 120)"/>

  <!-- Vertical Drape Lines / Creases down body -->
  <path d="M 115 130 C 110 150, 105 170, 95 192" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 165 110 C 160 140, 155 165, 145 195" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 220 95 C 220 135, 215 165, 205 198" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 270 115 C 275 145, 280 170, 275 194" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 330 135 C 340 155, 345 175, 340 193" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Light highlights on creases -->
  <path d="M 118 132 C 113 152, 108 172, 98 192" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <path d="M 168 112 C 163 142, 158 167, 148 195" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  <path d="M 273 117 C 278 147, 283 172, 278 194" stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- Bottom Hem / Elastic cord fold -->
  <path d="M 62 188 Q 110 198 190 196 Q 280 196 353 192" stroke="#022c22" stroke-width="3" fill="none"/>

  <!-- Badge overlay -->
  <g transform="translate(40, 40)">
    <rect width="115" height="26" rx="13" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="57" y="18" fill="#047857" font-size="12" font-weight="700" font-family="system-ui" text-anchor="middle">UNUSED / IDLE</text>
  </g>
</svg>
